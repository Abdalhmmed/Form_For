<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- زاوية ظل خفيفة تعطي رصانة الشعار المكتبي -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F1A22" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- الخلفية: لون الباذنجاني / البرقوقي الداكن المميز للشريط العلوي -->
  <rect width="512" height="512" rx="108" fill="#2A1B33" />

  <!-- إطار داخلي ناعم ورفيع -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#4B2E5C" stroke-width="3" stroke-opacity="0.6" />

  <!-- ورقة النموذج الهندسية المائلة قليلاً كرمز للأداة الورقية -->
  <g filter="url(#shadow)">
    <!-- ورقة بيضاء أساسية -->
    <rect x="100" y="86" width="312" height="340" rx="16" fill="#FFFFFF" />
    <!-- رأس الورقة الملون بلون الـ plum الهادئ -->
    <path d="M 100 102 C 100 93.16 107.16 86 116 86 L 396 86 C 404.84 86 412 93.16 412 102 L 412 144 L 100 144 Z" fill="#EFE8F2" />
    <!-- خط فاصل تحت الرأس -->
    <line x1="100" y1="144" x2="412" y2="144" stroke="#DDD6DF" stroke-width="2" />

    <!-- أسطر تعبيرية تمثل حقول النموذج -->
    <rect x="134" y="110" width="120" height="12" rx="4" fill="#4B2E5C" />
    <circle cx="376" cy="115" r="5" fill="#5E3A72" />

    <!-- خطوط حقول خلفية خفيفة -->
    <rect x="134" y="174" width="244" height="2" rx="1" fill="#EFE8F2" />
    <rect x="134" y="206" width="244" height="2" rx="1" fill="#EFE8F2" />
    <rect x="134" y="360" width="150" height="2" rx="1" fill="#DDD6DF" />
    <rect x="134" y="380" width="244" height="2" rx="1" fill="#EFE8F2" />
  </g>

  <!-- الحرفين FF بتصميم هندسي مونوغرام رصين ومتناسق -->
  <g fill="#2A1B33">
    <!-- الحرف F الأول -->
    <g transform="translate(142, 178)">
      <!-- الجذع الرأسي -->
      <rect x="0" y="0" width="24" height="150" rx="6" fill="#2A1B33" />
      <!-- الذراع العلوي -->
      <rect x="0" y="0" width="94" height="22" rx="6" fill="#2A1B33" />
      <!-- الذراع الأوسط -->
      <rect x="0" y="60" width="74" height="22" rx="6" fill="#4B2E5C" />
    </g>

    <!-- الحرف F الثاني بتداخل هندسي موازٍ -->
    <g transform="translate(254, 178)">
      <!-- الجذع الرأسي -->
      <rect x="0" y="0" width="24" height="150" rx="6" fill="#4B2E5C" />
      <!-- الذراع العلوي -->
      <rect x="0" y="0" width="94" height="22" rx="6" fill="#4B2E5C" />
      <!-- الذراع الأوسط بنبرة plum-600 لإضفاء عمق -->
      <rect x="0" y="60" width="70" height="22" rx="6" fill="#5E3A72" />
    </g>
  </g>

  <!-- لمسة نقطة هندسية صغيرة دقيقة بلون البرقوق المعتمد -->
  <circle cx="362" cy="324" r="8" fill="#5E3A72" />
</svg>
